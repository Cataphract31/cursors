<!doctype html>
<!-- TEMPORARY preview harness for src/tourxp.js. Delete after screenshotting. -->
<html><head><meta charset="utf-8"><title>txp preview</title>
<link rel="stylesheet" href="/node_modules/xp.css/dist/XP.css">
<link rel="stylesheet" href="/src/style.css">
<style>
body{background:#5A7EDC;margin:0;padding:18px;font-family:Tahoma,sans-serif}
#win-tourxp{position:static!important;display:flex!important;margin:0 auto}
/* ================= Tour Windows XP (tourstart.exe) ================= */
.txp-body{display:flex;flex-direction:column;min-height:0;padding:0;background:#ECE9D8;overflow:hidden}
.txp-banner{flex:none;padding:9px 16px 8px;color:#fff;border-bottom:1px solid #0A2E77;
  background:linear-gradient(180deg,#3C81E8 0,#1B5CC4 46%,#0B3E9E 100%);text-shadow:0 1px 1px rgba(0,0,0,.45)}
.txp-banner b{display:block;font-size:17px;letter-spacing:.2px;line-height:1.2}
.txp-banner span{font-size:11px;opacity:.9}
.txp-mid{flex:1;display:flex;min-height:0}
.txp-rail{flex:0 0 168px;overflow:auto;padding:8px 0;color:#fff;border-right:1px solid #17398C;
  background:linear-gradient(180deg,#5A8FE0 0,#2F63C6 45%,#1E48AC 100%)}
.txp-ch{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:11px;line-height:1.25;cursor:pointer;opacity:.85}
.txp-ch:hover{background:rgba(255,255,255,.12);opacity:1}
.txp-ch.on{background:rgba(255,255,255,.2);opacity:1;font-weight:bold;box-shadow:inset 3px 0 0 #FFC83D}
.txp-chico{width:16px;height:16px;flex:none}
.txp-stage{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 14px 10px;overflow:auto;
  background:linear-gradient(180deg,#EAF3DA 0,#CFE3AD 42%,#A8CC7C 100%)}
.txp-art{flex:none;height:180px;border-radius:8px;overflow:hidden;background:#fff;
  border:1px solid rgba(255,255,255,.75);box-shadow:0 2px 6px rgba(0,0,0,.22)}
.txp-copy{margin-top:10px;padding:9px 12px 10px;border-radius:8px;background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.txp-headrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.txp-headrow h2{margin:0;font-size:15px;font-weight:bold;color:#0A3E9E}
.txp-step{font-size:10px;color:#5A6B3A;white-space:nowrap}
.txp-pts{margin:7px 0 0;padding:0;list-style:none}
.txp-pts li{position:relative;padding-left:14px;font-size:12px;line-height:1.5;color:#1B1B1B}
.txp-pts li+li{margin-top:4px}
.txp-pts li::before{content:"\25B8";position:absolute;left:0;color:#4A7C1F}
.txp-foot{flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;background:#ECE9D8;border-top:1px solid #ACA899}
.txp-gap{flex:1}
.txp-spk{width:26px;height:22px;padding:0;display:grid;place-items:center;position:relative;cursor:pointer;
  border:1px solid #ACA899;border-radius:3px;background:linear-gradient(180deg,#fff 0,#E6E3D6 100%)}
.txp-spk .xico{width:16px;height:16px}
.txp-spk.off .xico{opacity:.35}
.txp-spk.off::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:2px;border-radius:1px;
  background:#C0392B;transform:rotate(-32deg)}
.txp-scene{position:relative;width:100%;height:100%;overflow:hidden}
.txp-desk{background-size:cover;background-position:center}
.txp-icons{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:10px}
.txp-icons span{display:flex;flex-direction:column;align-items:center;gap:2px;width:66px}
.txp-icons img{width:32px;height:32px}
.txp-icons i{font-style:normal;font-size:9px;line-height:1.1;color:#fff;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.85)}
.txp-ptr{position:absolute;left:52%;top:44%;width:20px;height:20px;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.5))}
.txp-tbar{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;gap:6px;
  border-top:1px solid #4F9EFF;background:linear-gradient(180deg,#3F8CF3 0,#245EDB 9%,#245EDB 88%,#1941A5 100%)}
.txp-start{height:24px;width:auto;display:block}
.txp-tab{display:flex;align-items:center;gap:4px;height:19px;padding:0 8px;font-size:10px;color:#fff;
  border-radius:2px;background:rgba(255,255,255,.22)}
.txp-tab img{width:14px;height:14px}
.txp-tray{margin-left:auto;display:flex;align-items:center;gap:5px;height:26px;padding:0 8px;
  background:linear-gradient(180deg,#149CE0 0,#0C77C4 100%)}
.txp-tray img{width:14px;height:14px}
.txp-luna{display:flex;align-items:center;gap:18px;padding:14px 18px;
  background:linear-gradient(135deg,#2F6FD8 0,#12439E 55%,#0A2E77 100%)}
.txp-flag{width:96px;height:auto;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.txp-pane{flex:1;min-width:0;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.94);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.txp-pane-h{padding:4px 10px;font-size:11px;font-weight:bold;color:#fff;background:linear-gradient(180deg,#6D9BE8 0,#3B6FD4 100%)}
.txp-pane-r{display:flex;align-items:center;gap:9px;padding:6px 10px;font-size:11px;color:#0A3E9E;border-top:1px solid #E2E8F5}
.txp-pane-r img{width:28px;height:28px;flex:none}
.txp-help{display:flex;flex-direction:column;gap:9px;padding:10px 14px;background:linear-gradient(180deg,#F3F7FF 0,#DDE8FA 100%)}
.txp-hbar{display:flex;align-items:center;gap:9px;font-size:14px;color:#0A3E9E}
.txp-hbar img{width:30px;height:30px}
.txp-hsearch{display:flex;align-items:center;gap:6px;font-size:11px;color:#33528F}
.txp-hsearch em{flex:1;height:19px;border:1px solid #7F9DB9;border-radius:2px;background:#fff}
.txp-hgo{width:16px;height:16px}
.txp-hcols{display:flex;gap:8px;margin-top:2px}
.txp-hcols>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;text-align:center;
  border-radius:6px;border:1px solid #C5D4EC;background:#fff;font-size:10px;color:#26467F}
.txp-hcols img{width:28px;height:28px}
.txp-hcols i{font-style:normal}
.txp-media{display:flex;flex-direction:column;gap:8px;padding:10px 14px;background:linear-gradient(180deg,#1B2B4A 0,#0A1326 100%)}
.txp-eq{flex:1;min-height:0;display:flex;align-items:flex-end;gap:3px}
.txp-eq i{flex:1;border-radius:1px 1px 0 0;background:linear-gradient(180deg,#7CE6A0 0,#2FA8D8 55%,#1B5CC4 100%)}
.txp-mrow{display:flex;align-items:center;gap:12px}
.txp-mrow img{width:28px;height:28px}
.txp-mlist{display:flex;gap:14px;font-size:10px;color:#9FC4E8}
.txp-photo{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:linear-gradient(180deg,#F1EFE2 0,#D8D3BE 100%)}
.txp-strip{flex:1;min-height:0;display:flex;gap:8px}
.txp-strip span{flex:1;background-size:260%;border:3px solid #fff;border-radius:2px;box-shadow:0 2px 5px rgba(0,0,0,.28)}
.txp-prow{display:flex;align-items:center;gap:7px;font-size:11px;color:#3B4A22}
.txp-prow img{width:22px;height:22px}
.txp-prow i{font-style:normal;margin-right:12px}
.txp-net{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0 14px;
  background:linear-gradient(180deg,#2F6FD8 0,#0E3B92 100%)}
.txp-wire{position:absolute;inset:0;width:100%;height:100%}
.txp-hub{position:relative;display:flex;align-items:center;gap:4px}
.txp-hub img{width:34px;height:34px}
.txp-globe{width:18px;height:18px}
.txp-nodes{position:relative;display:flex;gap:56px}
.txp-nodes img{width:30px;height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.txp-safe{display:flex;align-items:center;gap:16px;padding:12px 18px;background:linear-gradient(135deg,#E7EEF8 0,#C3D6EE 100%)}
.txp-shield{flex:none;width:74px;height:86px;display:grid;place-items:center;border:2px solid #fff;
  border-radius:8px 8px 38px 38px;box-shadow:0 2px 6px rgba(0,0,0,.3);
  background:linear-gradient(180deg,#3C81E8 0,#12439E 100%)}
.txp-shield img{width:34px;height:34px}
.txp-slist{flex:1;display:flex;flex-direction:column;gap:6px}
.txp-slist>div{display:flex;align-items:center;gap:9px;padding:5px 9px;font-size:11px;color:#123B84;
  border:1px solid #B8CCE6;border-radius:5px;background:#fff}
.txp-slist img{width:24px;height:24px;flex:none}
</style></head>
<body>
  <div class="window" id="win-tourxp" style="width:664px;height:520px">
    <div class="title-bar">
      <div class="tb-l"><i class="xico tb-ico" data-ico="flag16"></i><div class="title-bar-text">Tour Windows XP</div></div>
      <div class="title-bar-controls"><button aria-label="Minimize"></button><button aria-label="Close"></button></div>
    </div>
    <div class="win-body txp-body">
      <div class="txp-banner"><b>Tour Windows XP</b><span>Discover what you can do with Windows XP</span></div>
      <div class="txp-mid">
        <div class="txp-rail" id="txp-rail"></div>
        <div class="txp-stage">
          <div class="txp-art" id="txp-art"></div>
          <div class="txp-copy">
            <div class="txp-headrow"><h2 id="txp-head"></h2><span class="txp-step" id="txp-step"></span></div>
            <ul class="txp-pts" id="txp-pts"></ul>
          </div>
        </div>
      </div>
      <div class="txp-foot">
        <button class="txp-spk" id="txp-spk" aria-label="Tour music"><i class="xico" data-ico="trayVol"></i></button>
        <button class="xbtn" id="txp-play" style="min-width:96px">Play the tour</button>
        <span class="txp-gap"></span>
        <button class="xbtn" id="txp-back" style="min-width:74px">&lt; Back</button>
        <button class="xbtn" id="txp-next" style="min-width:74px">Next &gt;</button>
        <button class="xbtn" id="txp-exit" style="min-width:64px">Exit</button>
      </div>
    </div>
  </div>
<script type="module">
import { IMG, CURFILES } from "/src/assets.js";
import { initTourXP } from "/src/tourxp.js";
const $ = s => document.querySelector(s);
document.querySelectorAll(".xico[data-ico]").forEach(el => {
  const im = document.createElement("img"); im.src = IMG[el.dataset.ico]; el.appendChild(im);
});
const t = initTourXP({ $, store:{data:{},save(){}}, sysSnd(){}, openWin(){}, closeWin(){},
  isFocused:()=>true, IMG, CURFILES,
  hooks:{ getMaster:()=>1, getMuted:()=>true, waveBus:()=>1 } });
t.init();
t.open();
/* URL hash picks the chapter so one dev server can shoot all seven */
const n = +(location.hash.slice(1) || 0);
for (let i = 0; i < n; i++) $("#txp-next").click();
</script>
</body></html>
