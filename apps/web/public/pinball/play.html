<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D Pinball for Windows - Space Cadet</title>
<style>
/* Our own host page for the decompiled game — a black room and a centred
   canvas, nothing that can collapse.

   The picture on screen is NOT the game's WebGL canvas: on one real machine
   the GL canvas ran the whole game (sound, flippers, input) while
   compositing put pure black on screen and nothing in the console — a
   documented driver/compositor failure class. So the GL canvas is kept at
   opacity 0 (still laid out, still receiving the mouse) and every presented
   frame is copied onto #view, a plain 2D canvas, which every compositor on
   earth can draw. */
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#status{color:#9a9a9a;font:12px Tahoma,sans-serif;position:absolute;top:8px;left:0;right:0;text-align:center}
progress{position:absolute;top:26px;left:50%;width:220px;margin-left:-110px}
#stage{position:relative}
canvas{display:block;outline:none}
#canvas{opacity:0.001}   /* invisible but composited and clickable */
#view{position:absolute;left:0;top:0;pointer-events:none}
</style>
</head>
<body>
<div id="status">Downloading...</div>
<progress hidden id="progress" max="100" value="0"></progress>
<div id="stage">
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" style="display:none"></canvas>
<canvas id="view" style="display:none"></canvas>
</div>
<script>
/* Force preserveDrawingBuffer before the engine asks for its context, so the
   presented frame is still in the buffer when we copy it. */
(function(){
  var orig=HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext=function(kind,attrs){
    if(/webgl/.test(String(kind))){ attrs=attrs||{}; attrs.preserveDrawingBuffer=true; }
    return orig.call(this,kind,attrs);
  };
})();
/* the frame pump: mirror the GL canvas onto the 2D one, and say who is
   rendering in the console so a screenshot of it is a full bug report */
addEventListener("load",function(){
  var cv=document.getElementById("canvas"), view=document.getElementById("view");
  var g2=view.getContext("2d");
  var logged=false;
  (function pump(){
    requestAnimationFrame(pump);
    if(cv.style.display==="none"||!cv.width) return;
    if(view.width!==cv.width||view.height!==cv.height){ view.width=cv.width; view.height=cv.height; }
    view.style.display="block";
    try{ g2.drawImage(cv,0,0); }catch(e){}
    if(!logged){
      logged=true;
      try{
        var gl=cv.getContext("webgl")||cv.getContext("webgl2");
        var dbg=gl&&gl.getExtension("WEBGL_debug_renderer_info");
        console.log("[pinball] gl renderer:",dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):"(masked)",
          "| buffer:",cv.width+"x"+cv.height);
      }catch(e){ console.log("[pinball] gl probe failed:",e); }
    }
  })();
});
</script>
<script>
var statusElement=document.getElementById("status"),progressElement=document.getElementById("progress"),Module={preRun:[],postRun:[],print:function(){var e=document.getElementById("output");return e&&(e.value=""),function(e){arguments.length>1&&(e=Array.prototype.slice.call(arguments).join(" ")),console.log(e)}}(),printErr:function(e){arguments.length>1&&(e=Array.prototype.slice.call(arguments).join(" ")),console.error(e)},canvas:function(){var e=document.getElementById("canvas");return e.addEventListener("webglcontextlost",(function(e){alert("WebGL context lost. You will need to reload the page."),e.preventDefault()}),!1),e}(),setStatus:function(e){if(Module.setStatus.last||(Module.setStatus.last={time:Date.now(),text:""}),e!==Module.setStatus.last.text){var t=e.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/),n=Date.now();if(!(t&&n-Module.setStatus.last.time<30)){if(Module.setStatus.last.time=n,Module.setStatus.last.text=e,t)e=t[1],progressElement.value=100*parseInt(t[2]),progressElement.max=100*parseInt(t[4]),progressElement.hidden=!1;else progressElement.value=null,progressElement.max=null,progressElement.hidden=!0,document.getElementById("canvas").style.display="";statusElement.innerHTML=e,""===e?(statusElement.style.display="none",progressElement.style.display="none"):(statusElement.style.display="",progressElement.style.display="")}}},totalDependencies:0,monitorRunDependencies:function(e){this.totalDependencies=Math.max(this.totalDependencies,e),Module.setStatus(e?"Preparing... ("+(this.totalDependencies-e)+"/"+this.totalDependencies+")":"All downloads complete.")}};Module.setStatus("Downloading..."),window.onerror=function(){Module.setStatus("Exception thrown, see JavaScript console"),Module.setStatus=function(e){e&&Module.printErr("[post-exception status] "+e)}}
</script>
<script async src="SpaceCadetPinball.js"></script>
</body>
</html>
